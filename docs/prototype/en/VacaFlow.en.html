<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VacaFlow — Functional prototype</title>
<!--
  VacaFlow functional prototype (US-028).

  English re-cut of docs/prototype/VacaFlow.dc.html. Layout, spacing, palette
  and interactions are carried over unchanged; every visible string comes from
  the Backlog.md §3.5 microcopy catalog, which is authoritative for copy.

  Self-contained by design: no framework, no build step, no server. Open the
  file directly in a browser. The Spanish original depended on a runtime
  (support.js) that is not in the repository, so the x-dc template layer was
  replaced with plain DOM rendering — a change of implementation only.

  The one external reference is the Google Fonts link below, carried over
  from the original. Offline it simply fails and the font stack falls back to
  system-ui; everything else still works.

  State lives in localStorage under vacaflow_db_en_v1. Clearing site data
  resets the prototype to its seeded state.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:oklch(98% 0.004 250);font-family:'IBM Plex Sans',system-ui,sans-serif;color:oklch(22% 0.02 260)}
  a{color:oklch(52% 0.15 260);text-decoration:none}
  a:hover{color:oklch(46% 0.15 260);text-decoration:underline}
  :focus-visible{outline:2px solid oklch(52% 0.15 260);outline-offset:2px}
  ::placeholder{color:oklch(62% 0.01 260)}
  @keyframes vfFade{from{opacity:0}to{opacity:1}}
  .vf-skip{position:fixed;left:-9999px;top:0;background:white;color:oklch(22% 0.02 260);padding:12px 18px;z-index:200;border-radius:0 0 8px 0;font-size:14px;font-weight:600}
  .vf-skip:focus{left:0}
</style>
</head>
<body>
<a class="vf-skip" href="#main-content" id="skip-link"></a>
<div id="root"></div>

<script>
(function () {
  'use strict';

  var DB_KEY = 'vacaflow_db_en_v1';
  var SESSION_KEY = 'vacaflow_session_en';

  // ---------------------------------------------------------------------
  // Microcopy — Backlog.md §3.5. This table, not the markup, is
  // authoritative for copy. Grouped the same way the catalog is.
  // ---------------------------------------------------------------------
  var COPY = {
    wordmark: 'VacaFlow',
    signInSubtitle: 'Absence request management',
    createAccountSubtitle: 'Create an account',
    navRequests: 'My Requests',
    navQueue: 'Approval Queue',
    signOut: 'Sign out',
    skipLink: 'Skip to main content',
    dismissNotification: 'Dismiss notification',
    backToMyRequests: 'Back to my requests',
    roleEmployee: 'Employee',
    roleManager: 'Manager',

    labelEmail: 'Email',
    labelPassword: 'Password',
    passwordHelper: 'Minimum 8 characters.',
    labelFullName: 'Full name',
    labelRole: 'Role (for demo purposes)',
    labelAbsenceType: 'Absence type',
    absenceTypePlaceholder: 'Select…',
    labelStartDate: 'Start date',
    labelEndDate: 'End date',
    labelReason: 'Reason',
    labelDecisionComment: 'Comment (optional)',

    btnSignIn: 'Sign in',
    btnCreateAccount: 'Create account',
    btnNewRequest: 'New request',
    btnCreateRequest: 'Create request',
    btnSaveDraft: 'Save draft',
    btnSaveChanges: 'Save changes',
    btnCancel: 'Cancel',
    btnBack: 'Back',
    btnEdit: 'Edit',
    btnSubmit: 'Submit',
    btnView: 'View',
    btnCancelRequest: 'Cancel request',
    btnApprove: 'Approve',
    btnReject: 'Reject',
    btnYesCancel: 'Yes, cancel',

    linkNoAccount: "Don't have an account? ",
    linkSignUp: 'Sign up',
    linkHaveAccount: 'Already have an account? ',
    linkSignIn: 'Sign in',

    bannerAccountCreated: 'Account created. Welcome to VacaFlow!',
    bannerSignedIn: function (name) { return 'Signed in as ' + name + '.'; },
    bannerDraftCreated: 'Draft created.',
    bannerChangesSaved: 'Changes saved.',
    bannerSubmitted: 'Request submitted for approval.',
    bannerCancelled: 'Request cancelled.',
    bannerApproved: 'Request approved.',
    bannerRejected: 'Request rejected.',

    // FRD.md §7 error catalog, reproduced verbatim in Backlog.md §3.5.
    VF_AUT_001: 'An account with this email already exists.',
    VF_AUT_002: 'The email or password is incorrect.',
    VF_AUT_003: 'This account is not active.',
    // Carried for catalog completeness. The prototype has no unauthenticated
    // action surface — signing out returns to the auth card, so nothing can
    // be attempted without a session — but leaving the code out would make
    // the §3.5 error table look 15/16 covered rather than deliberately so.
    VF_AUT_004: 'You must be signed in to perform this action.',
    VF_CAT_001: 'The selected absence type does not exist or is not available.',
    VF_REQ_001: 'The end date cannot be earlier than the start date.',
    VF_REQ_002: 'The start date cannot be in the past.',
    VF_REQ_003: 'Only Draft requests can be edited.',
    VF_REQ_004: 'You can only act on your own requests.',
    VF_REQ_005: function (current, target) {
      return 'This request cannot move from ' + current + ' to ' + target + '.';
    },
    VF_REQ_006: 'The request was not found.',
    VF_DEC_001: 'Only Submitted requests can be approved or rejected.',
    VF_DEC_002: 'Only a manager can approve or reject a request.',
    VF_DEC_003: 'You are not the manager assigned to this employee.',
    VF_DEC_004: 'You cannot decide on your own request.',
    VF_DEC_005: 'This request already has a final decision.',

    valFullName: 'Full name is required (max 120 characters).',
    valEmail: 'Enter a valid email address, for example name@company.com',
    valPassword: 'The password must be at least 8 characters.',
    valStartDate: 'The start date is required.',
    valEndDate: 'The end date is required.',
    valReason: 'The reason is required (1 to 500 characters).',

    emptyRequestsTitle: "You haven't created any requests yet",
    emptyRequestsBody: 'Create your first absence request to get started.',
    emptyQueueTitle: 'No pending requests',
    emptyQueueBody: 'When an employee assigned to you submits a request, it will appear here.',

    modalCancelTitle: 'Cancel this request?',
    modalCancelBody: 'This action cannot be undone. The request will move to the Cancelled state.',
    modalApproveTitle: 'Approve this request?',
    modalRejectTitle: 'Reject this request?',

    decisionHeading: 'DECISION',
    decisionBy: function (name, when) { return 'By ' + name + ' · ' + when; },

    testAccountsHeading: 'TEST ACCOUNTS (NON-PRODUCTION)',

    // Prototype-only. See bannerFor().
    notPersisted: 'Saved for this session only — this browser is blocking storage, so the change will be lost on reload.',
    dataReset: 'Stored prototype data could not be read and was reset to the seeded state.',
    renderFailedTitle: 'The prototype could not render this screen.',
    renderFailedBody: 'Its stored data is in an unexpected shape. Clear this browser site data to reset it to the seeded state.',

    formTitleNew: 'New request',
    formTitleEdit: 'Edit draft',
    formTitleDetail: 'Request detail',
    titleMyRequests: 'My Requests',
    titleApprovalQueue: 'Approval Queue',
  };

  // State badge labels and colors — Backlog.md §3.4. Draft and Cancelled
  // deliberately share a background; label and available actions distinguish
  // them, never color alone (NFR-USA-007).
  var STATE_META = {
    Draft:     { label: 'Draft',     bg: 'oklch(93% 0.01 260)', fg: 'oklch(35% 0.02 260)' },
    Submitted: { label: 'Submitted', bg: 'oklch(90% 0.09 80)',  fg: 'oklch(38% 0.12 70)' },
    Approved:  { label: 'Approved',  bg: 'oklch(90% 0.09 150)', fg: 'oklch(33% 0.12 150)' },
    Rejected:  { label: 'Rejected',  bg: 'oklch(91% 0.09 25)',  fg: 'oklch(40% 0.15 25)' },
    Cancelled: { label: 'Cancelled', bg: 'oklch(93% 0.01 260)', fg: 'oklch(45% 0.01 260)' },
  };

  // One row carrying an unrecognised state must not take the page down with
  // it — the badge degrades to showing the raw value instead.
  function stateMeta(value) {
    return STATE_META[value] || { label: String(value), bg: 'oklch(93% 0.01 260)', fg: 'oklch(35% 0.02 260)' };
  }

  var S = {
    input: 'width:100%;padding:10px 12px;border:1px solid oklch(85% 0.008 260);border-radius:8px;font-size:15px;font-family:inherit',
    label: 'display:block;font-size:13px;font-weight:600;margin-bottom:6px',
    primaryBtn: 'background:oklch(52% 0.15 260);color:white;border:none;padding:11px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer',
    fieldError: 'color:oklch(50% 0.18 25);font-size:13px;margin:6px 0 0',
    alertBox: 'background:oklch(95% 0.03 25);border:1px solid oklch(80% 0.1 25);color:oklch(35% 0.15 25);font-size:14px;padding:10px 14px;border-radius:8px;margin-bottom:20px',
    card: 'background:white;border:1px solid oklch(90% 0.006 250);border-radius:12px',
    // List and queue cards use a 10px radius; only the panel-sized cards use 12px.
    rowCard: 'background:white;border:1px solid oklch(90% 0.006 250);border-radius:10px',
    outlineBtn: 'background:white;border:1px solid oklch(85% 0.008 260);padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
    dangerOutlineBtn: 'background:white;border:1px solid oklch(80% 0.1 25);color:oklch(45% 0.15 25);padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
    rowBtn: 'padding:8px 14px;border-radius:7px;border:1px solid oklch(85% 0.008 260);background:white;font-size:13px;font-weight:600;cursor:pointer',
    rowPrimaryBtn: 'padding:8px 14px;border-radius:7px;border:none;background:oklch(52% 0.15 260);color:white;font-size:13px;font-weight:600;cursor:pointer',
    rowDangerBtn: 'padding:8px 14px;border-radius:7px;border:1px solid oklch(80% 0.1 25);background:white;color:oklch(45% 0.15 25);font-size:13px;font-weight:600;cursor:pointer',
    navActive: 'padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:oklch(93% 0.03 260);color:oklch(35% 0.1 260)',
    navInactive: 'padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:oklch(45% 0.02 260)',
    emptyState: 'text-align:center;padding:64px 24px;background:white;border:1px dashed oklch(85% 0.008 260);border-radius:12px',
    skeletonBlock: 'border-radius:10px;background:oklch(94% 0.004 250)',
    modalOverlay: 'position:fixed;inset:0;background:oklch(0% 0 0 / 0.4);display:flex;align-items:center;justify-content:center;z-index:50;animation:vfFade .15s ease-out',
    modalPanel: 'background:white;border-radius:12px;padding:28px',
  };

  var state = {
    view: 'login',
    sessionId: null,
    loginFields: { email: '', password: '' },
    loginError: null,
    registerFields: { fullName: '', email: '', password: '', role: 'Employee' },
    registerErrors: {},
    formMode: 'create',
    formRequestId: null,
    formFields: { absenceTypeId: '', startDate: '', endDate: '', reason: '' },
    formErrors: {},
    saving: false,
    listLoading: false,
    banner: null,
    cancelConfirmId: null,
    decisionModal: null,
    navTab: 'requests',
  };

  // --- storage -----------------------------------------------------------

  // UNREADABLE is distinct from null: a garbled blob is the likeliest real
  // corruption, and it must still reach the reviewer as a notice rather than
  // silently reseeding as if nothing had been stored.
  var UNREADABLE = {};

  function readDb() {
    var raw = null;
    try { raw = localStorage.getItem(DB_KEY); }
    catch (err) { console.error('Could not read the prototype database:', err); return UNREADABLE; }
    if (raw === null) { return null; }
    try { return JSON.parse(raw) || UNREADABLE; }
    catch (err) { console.error('Stored prototype data is not valid JSON:', err); return UNREADABLE; }
  }

  // Returns whether the write landed. Callers must not report success on a
  // false: private browsing, storage-blocked origins and quota exhaustion all
  // throw here, and telling a reviewer "Request approved." for a change that
  // will vanish on reload is worse than telling them storage is unavailable.
  function saveDb(db) {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      return true;
    } catch (err) {
      console.error('Could not persist the prototype database:', err);
      return false;
    }
  }

  // Wraps a success banner so it degrades to an honest warning when the write
  // did not land. Not a §3.5 string — the catalog describes the real product,
  // which persists server-side and has no equivalent failure.
  function bannerFor(persisted, successMessage) {
    return persisted
      ? { type: 'success', message: successMessage }
      : { type: 'error', message: COPY.notPersisted };
  }

  var db = null;

  function saveSession(employeeId) {
    try { localStorage.setItem(SESSION_KEY, employeeId); return true; }
    catch (err) { console.error('Could not persist the session:', err); return false; }
  }

  function genId() { return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function nowIso() { return new Date().toISOString(); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  // NOT a hash. Reversible base64, so the prototype can compare a typed
  // password without pulling in crypto. The real system uses PBKDF2; nothing
  // here is a security control, which is why the seed field is named
  // passwordToken rather than passwordHash.
  function fakeHash(pw) { return btoa(unescape(encodeURIComponent('vf::' + pw))); }
  function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }

  // A stored value is only reusable if every collection the renderer walks is
  // present. A truncated write or a blob left by an older schema would
  // otherwise pass a shallow check and then crash mid-render, and because
  // render() clears the root first, the reviewer would be looking at a blank
  // page with no way back short of clearing site data.
  var REQUIRED_COLLECTIONS = ['employees', 'accounts', 'absenceTypes', 'requests', 'approvals'];

  function isUsable(candidate) {
    if (!candidate || candidate === UNREADABLE) { return false; }
    return REQUIRED_COLLECTIONS.every(function (key) { return Array.isArray(candidate[key]); });
  }

  var seedNotice = null;

  function seed() {
    var existing = readDb();
    if (isUsable(existing) && existing.employees.length) { db = existing; return; }
    if (existing) {
      console.error('Stored prototype data was unusable; reseeding.');
      seedNotice = { type: 'error', message: COPY.dataReset };
    }

    var managerId = genId(), emp1Id = genId(), emp2Id = genId();
    var typeVac = genId(), typePers = genId(), typeSick = genId();
    var today = new Date();
    var plus = function (days) {
      var d = new Date(today);
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    };

    db = {
      // Personal names stay as they are — they are domain data, not
      // interface copy. Absence type names are translated, matching what
      // Backlog.md §3.6 specifies for the real backend seed.
      employees: [
        { id: managerId, fullName: 'Laura Méndez', email: 'manager@vacaflow.test', role: 'Manager', isActive: true, managerId: null },
        { id: emp1Id, fullName: 'Carlos Ruiz', email: 'employee@vacaflow.test', role: 'Employee', isActive: true, managerId: managerId },
        { id: emp2Id, fullName: 'Ana Torres', email: 'ana@vacaflow.test', role: 'Employee', isActive: true, managerId: managerId },
      ],
      accounts: [
        { id: genId(), employeeId: managerId, passwordToken: fakeHash('Manager123!') },
        { id: genId(), employeeId: emp1Id, passwordToken: fakeHash('Employee123!') },
        { id: genId(), employeeId: emp2Id, passwordToken: fakeHash('Employee123!') },
      ],
      absenceTypes: [
        { id: typeVac, code: 'VACATION', name: 'Vacation', isActive: true },
        { id: typePers, code: 'PERSONAL_LEAVE', name: 'Personal Leave', isActive: true },
        { id: typeSick, code: 'SICK_LEAVE', name: 'Sick Leave', isActive: true },
      ],
      requests: [],
      approvals: [],
    };

    var mkReq = function (employeeId, absenceTypeId, startDate, endDate, reason, reqState) {
      var createdAt = nowIso();
      var isClosed = reqState === 'Approved' || reqState === 'Rejected' || reqState === 'Cancelled';
      return {
        id: genId(), employeeId: employeeId, absenceTypeId: absenceTypeId,
        startDate: startDate, endDate: endDate, reason: reason, state: reqState,
        createdAtUtc: createdAt, updatedAtUtc: createdAt,
        submittedAtUtc: reqState !== 'Draft' ? createdAt : null,
        closedAtUtc: isClosed ? createdAt : null,
      };
    };

    var rDraft = mkReq(emp1Id, typeVac, plus(10), plus(14), 'Year-end family trip', 'Draft');
    var rSubmitted = mkReq(emp1Id, typePers, plus(3), plus(3), 'Personal errand at the bank', 'Submitted');
    var rApproved = mkReq(emp1Id, typeVac, plus(-20), plus(-15), 'Summer holiday', 'Approved');
    var rRejected = mkReq(emp2Id, typeSick, plus(-5), plus(-3), 'Medical rest', 'Rejected');
    db.requests.push(rDraft, rSubmitted, rApproved, rRejected);
    db.approvals.push(
      { id: genId(), requestId: rApproved.id, responsibleManagerId: managerId, decision: 'Approved', comment: 'Enjoy your holiday.', decidedAtUtc: rApproved.createdAtUtc },
      { id: genId(), requestId: rRejected.id, responsibleManagerId: managerId, decision: 'Rejected', comment: 'A medical certificate must be attached.', decidedAtUtc: rRejected.createdAtUtc }
    );
    saveDb(db);
  }

  function getEmployee(id) {
    for (var i = 0; i < db.employees.length; i++) {
      if (db.employees[i].id === id) { return db.employees[i]; }
    }
    return null;
  }

  function currentUser() { return state.sessionId ? getEmployee(state.sessionId) : null; }

  // Every mutating action needs a signed-in caller. The auth card is the only
  // view rendered without one, so this should be unreachable — but a dead
  // button with an uncaught throw behind it is a worse answer than the
  // catalog's own VF-AUT-004.
  function requireUser() {
    var me = currentUser();
    if (!me) { setState({ banner: { type: 'error', message: COPY.VF_AUT_004 } }); return null; }
    return me;
  }

  function absenceTypeName(id) {
    for (var i = 0; i < db.absenceTypes.length; i++) {
      if (db.absenceTypes[i].id === id) { return db.absenceTypes[i].name; }
    }
    return '—';
  }

  function findRequest(id) {
    for (var i = 0; i < db.requests.length; i++) {
      if (db.requests[i].id === id) { return db.requests[i]; }
    }
    return null;
  }

  // --- DOM helpers -------------------------------------------------------
  // Everything is built with createElement and textContent. No innerHTML
  // anywhere, so a reason or a name containing markup renders as text.

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        var value = attrs[key];
        if (value === null || value === undefined || value === false) { return; }
        if (key === 'text') { node.textContent = value; }
        else if (key === 'style') { node.setAttribute('style', value); }
        else if (key.indexOf('on') === 0) {
          // Refuse a string here rather than letting it fall through to
          // setAttribute, which would turn it into a live inline handler.
          if (typeof value !== 'function') {
            throw new Error('el(): ' + key + ' must be a function, got ' + typeof value);
          }
          node.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (value === true) { node.setAttribute(key, ''); }
        else { node.setAttribute(key, value); }
      });
    }
    (children || []).forEach(function (child) {
      if (child === null || child === undefined || child === false) { return; }
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }

  function field(id, labelText, inputNode, errorText, helperText) {
    return el('div', null, [
      el('label', { for: id, style: S.label, text: labelText }),
      inputNode,
      helperText ? el('p', { style: 'font-size:12px;color:oklch(55% 0.02 260);margin:6px 0 0', text: helperText }) : null,
      errorText ? el('p', { role: 'alert', style: S.fieldError, text: errorText }) : null,
    ]);
  }

  function setState(patch) {
    Object.keys(patch).forEach(function (key) { state[key] = patch[key]; });
    render();
  }

  function reloadList() {
    setState({ listLoading: true });
    setTimeout(function () { setState({ listLoading: false }); }, 280);
  }

  // --- actions -----------------------------------------------------------

  function doRegister() {
    var f = state.registerFields;
    var errors = {};
    if (!f.fullName || f.fullName.trim().length < 1 || f.fullName.length > 120) { errors.fullName = COPY.valFullName; }
    if (!f.email || !isValidEmail(f.email) || f.email.length > 200) { errors.email = COPY.valEmail; }
    if (!f.password || f.password.length < 8) { errors.password = COPY.valPassword; }
    if (!errors.email) {
      var taken = db.employees.some(function (e) { return e.email.toLowerCase() === f.email.toLowerCase(); });
      if (taken) { errors.email = COPY.VF_AUT_001; }
    }
    if (Object.keys(errors).length) { setState({ registerErrors: errors }); return; }

    setState({ saving: true });
    setTimeout(function () {
      var firstManager = db.employees.filter(function (e) { return e.role === 'Manager'; })[0];
      var id = genId();
      db.employees.push({
        id: id, fullName: f.fullName.trim(), email: f.email.trim(), role: f.role, isActive: true,
        managerId: f.role === 'Employee' ? (firstManager ? firstManager.id : null) : null,
      });
      db.accounts.push({ id: genId(), employeeId: id, passwordToken: fakeHash(f.password) });
      var persisted = saveDb(db) && saveSession(id);
      setState({
        saving: false, sessionId: id, view: 'requests', navTab: 'requests',
        banner: bannerFor(persisted, COPY.bannerAccountCreated),
        registerFields: { fullName: '', email: '', password: '', role: 'Employee' }, registerErrors: {},
      });
    }, 300);
  }

  function doLogin() {
    var f = state.loginFields;
    var employee = db.employees.filter(function (e) {
      return e.email.toLowerCase() === f.email.trim().toLowerCase();
    })[0] || null;
    var account = employee ? db.accounts.filter(function (a) { return a.employeeId === employee.id; })[0] : null;

    if (!employee || !account || account.passwordToken !== fakeHash(f.password)) {
      setState({ loginError: COPY.VF_AUT_002, loginFields: { email: f.email, password: '' } });
      return;
    }
    if (!employee.isActive) {
      setState({ loginError: COPY.VF_AUT_003, loginFields: { email: f.email, password: '' } });
      return;
    }
    setState({
      sessionId: employee.id, view: 'requests', navTab: 'requests', loginError: null,
      loginFields: { email: '', password: '' },
      banner: bannerFor(saveSession(employee.id), COPY.bannerSignedIn(employee.fullName)),
    });
  }

  function doLogout() {
    try { localStorage.removeItem(SESSION_KEY); } catch (err) { console.error('Could not clear the session:', err); }
    setState({ sessionId: null, view: 'login', banner: null, navTab: 'requests' });
  }

  function validateRequestFields(f) {
    var errors = {};
    var type = db.absenceTypes.filter(function (t) { return t.id === f.absenceTypeId && t.isActive; })[0];
    if (!type) { errors.absenceTypeId = COPY.VF_CAT_001; }
    if (!f.startDate) { errors.startDate = COPY.valStartDate; }
    if (!f.endDate) { errors.endDate = COPY.valEndDate; }
    if (!errors.startDate && !errors.endDate && f.endDate < f.startDate) { errors.endDate = COPY.VF_REQ_001; }
    if (!errors.startDate && f.startDate < todayStr()) { errors.startDate = COPY.VF_REQ_002; }
    if (!f.reason || f.reason.trim().length < 1 || f.reason.length > 500) { errors.reason = COPY.valReason; }
    return errors;
  }

  function saveForm() {
    var f = state.formFields;
    var errors = validateRequestFields(f);
    if (Object.keys(errors).length) { setState({ formErrors: errors }); return; }

    setState({ saving: true });
    setTimeout(function () {
      var me = requireUser();
      if (!me) { setState({ saving: false }); return; }
      if (state.formMode === 'create') {
        var now = nowIso();
        db.requests.push({
          id: genId(), employeeId: me.id, absenceTypeId: f.absenceTypeId,
          startDate: f.startDate, endDate: f.endDate, reason: f.reason.trim(), state: 'Draft',
          createdAtUtc: now, updatedAtUtc: now, submittedAtUtc: null, closedAtUtc: null,
        });
        setState({ saving: false, view: 'requests', banner: bannerFor(saveDb(db), COPY.bannerDraftCreated) });
      } else {
        var r = findRequest(state.formRequestId);
        if (!r || r.employeeId !== me.id) {
          setState({ saving: false, formErrors: { general: COPY.VF_REQ_004 } });
          return;
        }
        if (r.state !== 'Draft') {
          setState({ saving: false, formErrors: { general: COPY.VF_REQ_003 } });
          return;
        }
        r.absenceTypeId = f.absenceTypeId; r.startDate = f.startDate; r.endDate = f.endDate;
        r.reason = f.reason.trim(); r.updatedAtUtc = nowIso();
        setState({ saving: false, view: 'requests', banner: bannerFor(saveDb(db), COPY.bannerChangesSaved) });
      }
      reloadList();
    }, 300);
  }

  function submitRequest(id) {
    var me = requireUser();
    if (!me) { return; }
    var r = findRequest(id);
    if (!r || r.employeeId !== me.id) { setState({ banner: { type: 'error', message: COPY.VF_REQ_004 } }); return; }
    if (r.state !== 'Draft') {
      setState({ banner: { type: 'error', message: COPY.VF_REQ_005(r.state, 'Submitted') } });
      return;
    }
    if (r.startDate < todayStr()) { setState({ banner: { type: 'error', message: COPY.VF_REQ_002 } }); return; }
    r.state = 'Submitted'; r.submittedAtUtc = nowIso(); r.updatedAtUtc = nowIso();
    setState({ banner: bannerFor(saveDb(db), COPY.bannerSubmitted) });
    reloadList();
  }

  function confirmCancel() {
    var id = state.cancelConfirmId;
    var me = requireUser();
    if (!me) { setState({ cancelConfirmId: null }); return; }
    var r = findRequest(id);
    if (!r || r.employeeId !== me.id) {
      setState({ cancelConfirmId: null, banner: { type: 'error', message: COPY.VF_REQ_004 } });
      return;
    }
    if (r.state !== 'Draft' && r.state !== 'Submitted') {
      setState({ cancelConfirmId: null, banner: { type: 'error', message: COPY.VF_REQ_005(r.state, 'Cancelled') } });
      return;
    }
    r.state = 'Cancelled'; r.closedAtUtc = nowIso(); r.updatedAtUtc = nowIso();
    setState({ cancelConfirmId: null, banner: bannerFor(saveDb(db), COPY.bannerCancelled) });
    reloadList();

  function confirmDecision() {
    var modal = state.decisionModal;
    var me = requireUser();
    if (!me) { setState({ decisionModal: null }); return; }
    var r = findRequest(modal.id);
    if (!r) { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_REQ_006 } }); return; }
    if (r.state !== 'Submitted') { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_DEC_001 } }); return; }
    if (me.role !== 'Manager') { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_DEC_002 } }); return; }
    var owner = getEmployee(r.employeeId);
    if (!owner || owner.managerId !== me.id) { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_DEC_003 } }); return; }
    if (r.employeeId === me.id) { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_DEC_004 } }); return; }
    var decided = db.approvals.some(function (a) { return a.requestId === r.id; });
    if (decided) { setState({ decisionModal: null, banner: { type: 'error', message: COPY.VF_DEC_005 } }); return; }

    var decision = modal.action === 'approve' ? 'Approved' : 'Rejected';
    var comment = modal.comment && modal.comment.trim() ? modal.comment.trim() : null;
    db.approvals.push({

    });

    setState({

      banner: bannerFor(saveDb(db), decision === 'Approved' ? COPY.bannerApproved : COPY.bannerRejected),
    });
    reloadList();
  }

    var startInput = el('input', {
      id: 'f-start', type: 'date', min: todayStr(), value: state.formFields.startDate, disabled: readOnly,
      style: S.input,
      oninput: function (ev) {
        state.formFields.startDate = ev.target.value;
        // Keeps the end-date picker's floor tracking the start date as the
        // user types, the way the original did by re-rendering on every
        // keystroke. Set directly rather than re-rendering, so the field
        // being typed into does not lose focus.
        endInput.min = ev.target.value || todayStr();
      },
    });

    return el('div', null, [
      el('div', { style: 'display:flex;align-items:center;gap:12px;margin-bottom:24px' }, [
        el('button', {
          'aria-label': COPY.backToMyRequests, text: '←',
          style: 'background:none;border:none;font-size:20px;cursor:pointer;color:oklch(50% 0.02 260)',
          onclick: backToList,
        }),
        el('h1', { style: 'font-size:24px;font-weight:600;margin:0', text: title }),
      ]),
      el('div', { style: 'max-width:560px;' + S.card + ';padding:32px' }, [
        state.formErrors.general ? el('div', { role: 'alert', style: S.alertBox, text: state.formErrors.general }) : null,
        el('div', { style: 'display:flex;flex-direction:column;gap:18px' }, [
          field('f-type', COPY.labelAbsenceType, typeSelect, state.formErrors.absenceTypeId),
          el('div', { style: 'display:flex;gap:16px;flex-wrap:wrap' }, [
            el('div', { style: 'flex:1;min-width:180px' }, [field('f-start', COPY.labelStartDate, startInput, state.formErrors.startDate)]),
            el('div', { style: 'flex:1;min-width:180px' }, [field('f-end', COPY.labelEndDate, endInput, state.formErrors.endDate)]),
          ]),
          el('div', null, [
            reasonHeader,
            reasonBox,
            state.formErrors.reason ? el('p', { role: 'alert', style: S.fieldError, text: state.formErrors.reason }) : null,
          ]),
        ]),
        decisionBlock,
        el('div', { style: 'display:flex;gap:12px;margin-top:28px;align-items:center;flex-wrap:wrap' }, [
          !readOnly ? el('button', {
            disabled: state.saving,
            style: 'background:oklch(52% 0.15 260);color:white;border:none;padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
            text: state.formMode === 'create' ? COPY.btnSaveDraft : COPY.btnSaveChanges,
            onclick: saveForm,
          }) : null,
          el('button', { style: S.outlineBtn, text: readOnly ? COPY.btnBack : COPY.btnCancel, onclick: backToList }),
          cancellable ? el('button', {
            style: 'margin-left:auto;' + S.dangerOutlineBtn,
            text: COPY.btnCancelRequest,
            onclick: function () { setState({ cancelConfirmId: state.formRequestId }); },
          }) : null,
        ]),
      ]),
    ]);
  }

  function renderCancelModal() {
    if (!state.cancelConfirmId) { return null; }
    return el('div', {
      style: S.modalOverlay,
      onclick: function () { setState({ cancelConfirmId: null }); },
    }, [
      el('div', {
        style: S.modalPanel + ';max-width:400px;width:90%',
        role: 'dialog', 'aria-modal': 'true',
        onclick: function (ev) { ev.stopPropagation(); },
      }, [
        el('div', { style: 'font-size:17px;font-weight:600;margin-bottom:8px', text: COPY.modalCancelTitle }),
        el('div', { style: 'font-size:14px;color:oklch(45% 0.02 260);margin-bottom:24px', text: COPY.modalCancelBody }),
        el('div', { style: 'display:flex;gap:12px;justify-content:flex-end' }, [
          el('button', {
            style: 'background:white;border:1px solid oklch(85% 0.008 260);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
            text: COPY.btnBack, onclick: function () { setState({ cancelConfirmId: null }); },
          }),
          el('button', {
            style: 'background:oklch(55% 0.18 25);color:white;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
            text: COPY.btnYesCancel, onclick: confirmCancel,
          }),
        ]),
      ]),
    ]);
  }

  function renderDecisionModal() {
    var modal = state.decisionModal;
    if (!modal) { return null; }
    var isApprove = modal.action === 'approve';

    var commentBox = el('textarea', {
      id: 'decision-comment', maxlength: '500', rows: '3',
      style: S.input.replace('font-size:15px', 'font-size:14px') + ';resize:vertical',
      oninput: function (ev) { modal.comment = ev.target.value; },
    });
    commentBox.value = modal.comment || '';

    return el('div', {
      style: S.modalOverlay,
      onclick: function () { setState({ decisionModal: null }); },
    }, [
      el('div', {
        style: S.modalPanel + ';max-width:420px;width:90%',
        role: 'dialog', 'aria-modal': 'true',
        onclick: function (ev) { ev.stopPropagation(); },
      }, [
        el('div', { style: 'font-size:17px;font-weight:600;margin-bottom:16px', text: isApprove ? COPY.modalApproveTitle : COPY.modalRejectTitle }),
        el('label', { for: 'decision-comment', style: S.label, text: COPY.labelDecisionComment }),
        commentBox,
        el('div', { style: 'display:flex;gap:12px;justify-content:flex-end;margin-top:20px' }, [
          el('button', {
            style: 'background:white;border:1px solid oklch(85% 0.008 260);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
            text: COPY.btnCancel, onclick: function () { setState({ decisionModal: null }); },
          }),
          el('button', {
            style: 'background:' + (isApprove ? 'oklch(55% 0.14 150)' : 'oklch(55% 0.18 25)') + ';color:white;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer',
            text: isApprove ? COPY.btnApprove : COPY.btnReject, onclick: confirmDecision,
          }),
        ]),
      ]),
    ]);
  }

  // render() clears the root before rebuilding, so any throw inside the tree
  // build would otherwise leave a blank page with no route back short of
  // clearing site data. Malformed stored rows are the known way in; this
  // catches those and anything else, and tells the reviewer how to recover.
  function render() {
    try { renderTree(); }
    catch (err) {
      console.error('The prototype could not render:', err);
      var root = document.getElementById('root');
      root.textContent = '';
      root.appendChild(el('div', { style: 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px' }, [
        el('div', { style: 'max-width:480px;' + S.card + ';padding:32px' }, [
          el('div', { style: 'font-size:17px;font-weight:600;margin-bottom:8px', text: COPY.renderFailedTitle }),
          el('div', { style: 'font-size:14px;color:oklch(45% 0.02 260)', text: COPY.renderFailedBody }),
        ]),
      ]));
    }
  }

  function renderTree() {
    var root = document.getElementById('root');
    root.textContent = '';

    var me = currentUser();
    if (!me) {
      // The banner slot lives in the authenticated shell, but a reseed notice
      // or a storage warning is raised precisely when there is no session —
      // without this the message would be written to state and never seen.
      var signedOutBanner = renderBanner();
      if (signedOutBanner) { root.appendChild(signedOutBanner); }
      root.appendChild(state.view === 'register' ? renderRegister() : renderLogin());
      return;
    }

    var isManager = me.role === 'Manager';
    var queueCount = isManager ? queueFor(me).length : 0;
    var showQueue = state.navTab === 'queue' && isManager;

    var main;
    if (state.view === 'form') { main = renderForm(me); }
    else if (showQueue) { main = renderQueue(me); }
    else { main = renderMyRequests(me); }

    root.appendChild(el('div', { style: 'min-height:100vh;display:flex;flex-direction:column' }, [
      renderHeader(me, queueCount),
      renderBanner(),
      el('main', { id: 'main-content', style: 'flex:1;padding:32px;max-width:1100px;width:100%;margin:0 auto;box-sizing:border-box' }, [main]),
    ]));

    var cancelModal = renderCancelModal();
    if (cancelModal) { root.appendChild(cancelModal); }
    var decisionModal = renderDecisionModal();
    if (decisionModal) { root.appendChild(decisionModal); }
  }

  // --- boot --------------------------------------------------------------

  seed();
  if (seedNotice) { state.banner = seedNotice; }

  document.getElementById('skip-link').textContent = COPY.skipLink;

  var storedSession = null;
  try { storedSession = localStorage.getItem(SESSION_KEY); } catch (err) { console.error('Could not read the session:', err); }
  if (storedSession && getEmployee(storedSession)) {
    state.sessionId = storedSession;
    state.view = 'requests';
  }

  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') { return; }
    if (state.decisionModal) { setState({ decisionModal: null }); }
    else if (state.cancelConfirmId) { setState({ cancelConfirmId: null }); }
  });

  render();
})();
</script>
</body>
</html>
